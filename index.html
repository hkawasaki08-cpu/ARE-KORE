<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>アレ・コレ（ARE-KORE）- 現場支援AI</title>
  <style>
    :root {
      --primary: #f59e0b;
      --primary-dark: #d97706;
      --bg: #f3f4f6;
      --chat-bg: #ffffff;
      --user-msg: #fef3c7;
      --ai-msg: #ffffff;
      --border: #e5e7eb;
      --text: #1f2937;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      height: 100dvh;
    }
    .app-container {
      width: 100%;
      max-width: 600px;
      height: 100%;
      background: var(--chat-bg);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }
    /* ヘッダー */
    header {
      background: #1e293b;
      color: white;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--primary);
    }
    header h1 { font-size: 1.05rem; font-weight: bold; }
    header .header-btns button {
      background: #334155;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      margin-left: 4px;
    }

    /* お試しギャラリー */
    .sample-section {
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
      padding: 8px;
    }
    .sample-title {
      font-size: 0.75rem;
      color: #64748b;
      margin-bottom: 6px;
      font-weight: bold;
    }
    .sample-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .sample-card {
      flex: 0 0 130px;
      background: white;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 6px;
      cursor: pointer;
      text-align: center;
      font-size: 0.75rem;
    }
    .sample-card img {
      width: 100%;
      height: 60px;
      object-fit: cover;
      border-radius: 4px;
      margin-bottom: 4px;
    }
    .sample-card-name {
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* チャットエリア */
    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 88%;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      line-height: 1.45;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .msg-user {
      align-self: flex-end;
      background: var(--user-msg);
      border: 1px solid #fde68a;
    }
    .msg-ai {
      align-self: flex-start;
      background: var(--ai-msg);
      border: 1px solid var(--border);
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .msg img {
      max-width: 100%;
      border-radius: 6px;
      margin-bottom: 6px;
      display: block;
    }

    /* アクションボタン（はい／いいえ、メール） */
    .quick-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .quick-btn {
      flex: 1;
      padding: 8px;
      font-size: 0.85rem;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-yes { background: #10b981; color: white; }
    .btn-no { background: #ef4444; color: white; }
    .btn-mail {
      background: #2563eb;
      color: white;
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* 画像プレビュー */
    .preview-bar {
      display: none;
      padding: 6px 12px;
      background: #e2e8f0;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
    }
    .preview-bar img {
      width: 40px;
      height: 40px;
      object-fit: cover;
      border-radius: 4px;
    }
    .preview-bar button {
      background: none;
      border: none;
      color: #ef4444;
      font-size: 1rem;
      cursor: pointer;
      margin-left: auto;
    }

    /* 入力フッター */
    footer {
      border-top: 1px solid var(--border);
      padding: 8px 10px;
      background: white;
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }
    .file-btn {
      background: #e2e8f0;
      border: none;
      border-radius: 6px;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.2rem;
      flex-shrink: 0;
    }
    textarea {
      flex: 1;
      height: 42px;
      min-height: 42px;
      max-height: 100px;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.9rem;
      resize: none;
      outline: none;
      font-family: inherit;
    }
    .send-btn {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 0 14px;
      height: 42px;
      font-weight: bold;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* 設定モーダル */
    .modal {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-content {
      background: white;
      padding: 16px;
      border-radius: 8px;
      width: 100%;
      max-width: 400px;
    }
    .modal-content h2 { font-size: 1rem; margin-bottom: 12px; }
    .modal-content label { display: block; font-size: 0.8rem; margin: 8px 0 4px; color: #475569; }
    .modal-content input {
      width: 100%;
      padding: 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.85rem;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 14px;
    }
    .modal-actions button {
      padding: 6px 12px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- ヘッダー -->
  <header>
    <h1>アレ・コレ（ARE-KORE）</h1>
    <div class="header-btns">
      <button onclick="resetChat()">クリア</button>
      <button onclick="openSettings()">⚙ 設定</button>
    </div>
  </header>

  <!-- お試し資材ギャラリー（管理者設定） -->
  <div class="sample-section">
    <div class="sample-title">▼ お試しサンプル（タップでセット）</div>
    <div class="sample-scroll" id="sampleScroll"></div>
  </div>

  <!-- チャット履歴 -->
  <div class="chat-box" id="chatBox"></div>

  <!-- 画像プレビュー -->
  <div class="preview-bar" id="previewBar">
    <img id="previewImg" src="">
    <span id="previewText">画像添付中</span>
    <button onclick="clearImage()">×</button>
  </div>

  <!-- 入力フッター -->
  <footer>
    <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFileSelect(event)">
    <button class="file-btn" onclick="document.getElementById('fileInput').click()" title="カメラ・写真選択">📷</button>
    <textarea id="textInput" placeholder="短文入力 (例: ダクターD2 / 3m / ダイマ / 1束 / 明日午後 / 既設エリア)" rows="1"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">送信</button>
  </footer>

  <!-- 設定モーダル -->
  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <h2>⚙ アプリ・メール送信設定</h2>
      <label>Gemini APIキー:</label>
      <input type="password" id="apiKeyInput" placeholder="AI StudioのAPIキーを入力">
      
      <label>送信先メールアドレス (To):</label>
      <input type="email" id="mailToInput" placeholder="office@example.com">
      
      <label>CC メールアドレス (任意):</label>
      <input type="email" id="mailCcInput" placeholder="site-cc@example.com">
      
      <label>担当者名 / 工区名 (任意):</label>
      <input type="text" id="senderNameInput" placeholder="例: 電気A工区 花岡">

      <div class="modal-actions">
        <button onclick="closeSettings()" style="background:#e2e8f0;">閉じる</button>
        <button onclick="saveSettings()" style="background:var(--primary);color:white;">保存</button>
      </div>
    </div>
  </div>
</div>

<script>
  /* =========================================================
     管理者設定：お試しプリセット画像リスト
     ========================================================= */
  const SAMPLE_PRESETS = [
    {
      id: "sample_01",
      title: "ダクターD2",
      description: "ネグロス D2",
      imageUrl: "https://placehold.co/120x80/f59e0b/ffffff?text=D2+Channel",
      defaultText: "ダクターD2\n3m\nダイマ\n1束\n明日午後\n既設エリア"
    },
    {
      id: "sample_02",
      title: "ラック分岐部",
      description: "アルミラック 150幅",
      imageUrl: "https://placehold.co/120x80/3b82f6/ffffff?text=Cable+Rack",
      defaultText: "このラック本体とジョイント金具の手配"
    },
    {
      id: "sample_03",
      title: "C型吊り金具",
      description: "吊りボルト支持",
      imageUrl: "https://placehold.co/120x80/10b981/ffffff?text=C-Clamp",
      defaultText: "この支持金具の正式型番と適合ボルトサイズ特定"
    }
  ];

  /* システムプロンプト */
  const SYSTEM_INSTRUCTION = `
あなたは現場資材手配・仕様特定アシスタント「アレ・コレ」です。
職人や管理者の短文入力・現場写真から資材を特定し、手配を支援します。

【基本カタログ】
ネグロス電工、未来工業、丸井産業、共同カイテック

【重要：仕様確認ルール】
チャンネル・レール類（ダクター等）は「定尺（2m/3m/4m等）」と「材質・表面処理（ダイマ、ドブ、SUS等）」が必須です。
これらが抜けている場合、勝手に補完せず必ず【仮受付フォーマット】で聞き返してください。

【出力フォーマット】
1. 不足がある場合：
■ 手配内容の確認（仮受付）
・品名・型番: [品名]
・定尺・仕様: 【未指定：要確認】
・数量: [数量]
・希望納期日: [納期]
・納品場所: [場所]
【確認事項】: 不足項目を簡潔に質問

2. 全て揃った場合：
■ 手配内容の最終確認
・品名・型番: [正式型番・定尺・材質]
・区分: 購入
・数量: [数量]
・希望納期日: [納期]
・納品場所: [場所]
※ダクタークリップや適合ジョイント金具の追加要否を一言添える。
「上記の内容で手配・発注を確定してもよろしいでしょうか？（はい／いいえ）」

3. 「はい」で承認された場合：
■ 手配完了
確定内容を整理して出力し、「手配を確定いたしました」と結ぶ。
`;

  let chatHistory = [];
  let currentAttachedImage = null;
  let lastFinalDetails = null;

  window.addEventListener('DOMContentLoaded', () => {
    loadSettings();
    renderSamplePresets();
    addMessageToUI('ai', '現場支援AI「アレ・コレ」起動しました。\n短文入力（ダクターD2 / 3m / ダイマ...）または写真添付で指示してください！');
  });

  function renderSamplePresets() {
    const container = document.getElementById('sampleScroll');
    container.innerHTML = '';
    SAMPLE_PRESETS.forEach(item => {
      const card = document.createElement('div');
      card.className = 'sample-card';
      card.onclick = () => setSample(item);
      card.innerHTML = `
        <img src="${item.imageUrl}" alt="${item.title}">
        <div class="sample-card-name">${item.title}</div>
      `;
      container.appendChild(card);
    });
  }

  function setSample(item) {
    document.getElementById('textInput').value = item.defaultText;
    currentAttachedImage = item.imageUrl;
    document.getElementById('previewImg').src = item.imageUrl;
    document.getElementById('previewBar').style.display = 'flex';
  }

  function handleFileSelect(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      currentAttachedImage = event.target.result;
      document.getElementById('previewImg').src = currentAttachedImage;
      document.getElementById('previewBar').style.display = 'flex';
    };
    reader.readAsDataURL(file);
  }

  function clearImage() {
    currentAttachedImage = null;
    document.getElementById('fileInput').value = '';
    document.getElementById('previewBar').style.display = 'none';
  }

  async function sendMessage(overrideText = null) {
    const textInput = document.getElementById('textInput');
    const text = overrideText || textInput.value.trim();
    const imageToSend = currentAttachedImage;

    if (!text && !imageToSend) return;

    addMessageToUI('user', text, imageToSend);
    if (!overrideText) textInput.value = '';
    clearImage();

    const apiKey = localStorage.getItem('arekore_api_key');
    if (!apiKey) {
      addMessageToUI('ai', '⚠ Gemini APIキーが未設定です。右上の「⚙ 設定」からAPIキーを入力してください。');
      openSettings();
      return;
    }

    const parts = [];
    if (text) parts.push({ text: text });
    if (imageToSend && imageToSend.startsWith('data:image')) {
      const mimeType = imageToSend.split(';')[0].split(':')[1];
      const base64Data = imageToSend.split(',')[1];
      parts.push({
        inlineData: { mimeType: mimeType, data: base64Data }
      });
    }

    chatHistory.push({ role: 'user', parts: parts });

    const loadingId = addMessageToUI('ai', '解析中...');

    try {
      // エラー指示に基づき gemini-3.8-flash を指定
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          systemInstruction: { parts: [{ text: SYSTEM_INSTRUCTION }] },
          contents: chatHistory
        })
      });

      const data = await response.json();
      removeMessage(loadingId);

      if (data.candidates && data.candidates[0].content) {
        const aiReply = data.candidates[0].content.parts[0].text;
        chatHistory.push({ role: 'model', parts: [{ text: aiReply }] });
        addAiMessageWithActions(aiReply);
      } else {
        addMessageToUI('ai', 'エラー: 応答を取得できませんでした。\n' + JSON.stringify(data));
      }
    } catch (err) {
      removeMessage(loadingId);
      addMessageToUI('ai', '通信エラーが発生しました: ' + err.message);
    }
  }

  function addMessageToUI(role, text, imgSrc = null) {
    const box = document.getElementById('chatBox');
    const msg = document.createElement('div');
    const id = 'msg_' + Date.now();
    msg.id = id;
    msg.className = `msg ${role === 'user' ? 'msg-user' : 'msg-ai'}`;

    if (imgSrc) {
      const img = document.createElement('img');
      img.src = imgSrc;
      msg.appendChild(img);
    }
    const txtNode = document.createElement('div');
    txtNode.innerText = text;
    msg.appendChild(txtNode);

    box.appendChild(msg);
    box.scrollTop = box.scrollHeight;
    return id;
  }

  function removeMessage(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
  }

  function addAiMessageWithActions(text) {
    const box = document.getElementById('chatBox');
    const msg = document.createElement('div');
    msg.className = 'msg msg-ai';

    const txtNode = document.createElement('div');
    txtNode.innerText = text;
    msg.appendChild(txtNode);

    if (text.includes('最終確認') && text.includes('はい') && text.includes('いいえ')) {
      const actions = document.createElement('div');
      actions.className = 'quick-actions';
      actions.innerHTML = `
        <button class="quick-btn btn-yes" onclick="sendMessage('はい')">✓ はい（確定）</button>
        <button class="quick-btn btn-no" onclick="sendMessage('いいえ')">✗ いいえ（修正）</button>
      `;
      msg.appendChild(actions);
      lastFinalDetails = text;
    }

    if (text.includes('手配完了') || text.includes('手配を確定いたしました')) {
      const mailBtn = document.createElement('button');
      mailBtn.className = 'btn-mail';
      mailBtn.innerHTML = '✉️ メールソフトを起動して発注送信';
      mailBtn.onclick = () => launchMailClient(lastFinalDetails || text);
      msg.appendChild(mailBtn);
    }

    box.appendChild(msg);
    box.scrollTop = box.scrollHeight;
  }

  function launchMailClient(bodyText) {
    const to = localStorage.getItem('arekore_mail_to') || 'office@example.com';
    const cc = localStorage.getItem('arekore_mail_cc') || '';
    const sender = localStorage.getItem('arekore_sender_name') || '現場担当者';

    const subject = encodeURIComponent(`【資材手配確定】${sender}より`);
    const fullBody = `現場支援AI「アレ・コレ」より以下の内容で手配が確定しました。\n\n${bodyText}\n\n送信元: ${sender}\n送信日時: ${new Date().toLocaleString()}`;
    const body = encodeURIComponent(fullBody);

    let mailtoUrl = `mailto:${to}?subject=${subject}&body=${body}`;
    if (cc) mailtoUrl += `&cc=${encodeURIComponent(cc)}`;

    window.location.href = mailtoUrl;
  }

  function openSettings() {
    document.getElementById('apiKeyInput').value = localStorage.getItem('arekore_api_key') || '';
    document.getElementById('mailToInput').value = localStorage.getItem('arekore_mail_to') || 'office@example.com';
    document.getElementById('mailCcInput').value = localStorage.getItem('arekore_mail_cc') || '';
    document.getElementById('senderNameInput').value = localStorage.getItem('arekore_sender_name') || '';
    document.getElementById('settingsModal').style.display = 'flex';
  }

  function closeSettings() {
    document.getElementById('settingsModal').style.display = 'none';
  }

  function saveSettings() {
    localStorage.setItem('arekore_api_key', document.getElementById('apiKeyInput').value.trim());
    localStorage.setItem('arekore_mail_to', document.getElementById('mailToInput').value.trim());
    localStorage.setItem('arekore_mail_cc', document.getElementById('mailCcInput').value.trim());
    localStorage.setItem('arekore_sender_name', document.getElementById('senderNameInput').value.trim());
    closeSettings();
    alert('設定を保存しました。');
  }

  function loadSettings() {
    if (!localStorage.getItem('arekore_mail_to')) {
      localStorage.setItem('arekore_mail_to', 'office@example.com');
    }
  }

  function resetChat() {
    if (confirm('会話履歴をクリアして最初に戻しますか？')) {
      chatHistory = [];
      clearImage();
      document.getElementById('chatBox').innerHTML = '';
      addMessageToUI('ai', '現場支援AI「アレ・コレ」起動しました。\n短文入力または写真添付で指示してください！');
    }
  }
</script>
</body>
</html>
