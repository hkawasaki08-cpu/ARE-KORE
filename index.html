<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>アレ・コレ（ARE-KORE）- 現場支援AI</title>
  <style>
    :root {
      --primary: #f59e0b;
      --primary-dark: #d97706;
      --bg: #f3f4f6;
      --chat-bg: #ffffff;
      --user-msg: #fef3c7;
      --ai-msg: #ffffff;
      --border: #e5e7eb;
      --text: #1f2937;

      /* レスポンシブ文字サイズ基準（スマホ標準） */
      --font-scale: 1;
      --font-chat: calc(0.9rem * var(--font-scale));
      --font-input: calc(0.95rem * var(--font-scale));
    }

    /* タブレット向け調整 */
    @media (min-width: 600px) {
      :root {
        --font-chat: calc(1.0rem * var(--font-scale));
        --font-input: calc(1.05rem * var(--font-scale));
      }
    }

    /* PC・大画面向け調整 */
    @media (min-width: 1024px) {
      :root {
        --font-chat: calc(1.05rem * var(--font-scale));
        --font-input: calc(1.1rem * var(--font-scale));
      }
    }

    /* 文字サイズモード */
    body.font-normal { --font-scale: 1.0; }
    body.font-medium { --font-scale: 1.18; }
    body.font-large  { --font-scale: 1.35; }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      height: 100dvh;
    }
    .app-container {
      width: 100%;
      max-width: 600px;
      height: 100%;
      background: var(--chat-bg);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }

    /* ヘッダー */
    header {
      background: #1e293b;
      color: white;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--primary);
      flex-shrink: 0;
    }
    header h1 { font-size: 1.05rem; font-weight: bold; }
    header .header-btns button {
      background: #334155;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      margin-left: 4px;
    }

    /* チャット履歴エリア */
    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 88%;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: var(--font-chat);
      line-height: 1.45;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .msg-user {
      align-self: flex-end;
      background: var(--user-msg);
      border: 1px solid #fde68a;
    }
    .msg-ai {
      align-self: flex-start;
      background: var(--ai-msg);
      border: 1px solid var(--border);
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .msg img {
      max-width: 100%;
      border-radius: 6px;
      margin-bottom: 6px;
      display: block;
    }

    /* クイックアクションボタン */
    .quick-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .quick-btn {
      flex: 1;
      padding: 8px;
      font-size: var(--font-chat);
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-yes { background: #10b981; color: white; }
    .btn-no { background: #ef4444; color: white; }
    .btn-mail {
      background: #2563eb;
      color: white;
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: var(--font-chat);
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* 画像プレビュー */
    .preview-bar {
      display: none;
      padding: 6px 12px;
      background: #e2e8f0;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      flex-shrink: 0;
    }
    .preview-bar img {
      width: 40px;
      height: 40px;
      object-fit: cover;
      border-radius: 4px;
    }
    .preview-bar button {
      background: none;
      border: none;
      color: #ef4444;
      font-size: 1rem;
      cursor: pointer;
      margin-left: auto;
    }

    /* 現場操作ツールバー（文字サイズ＋小型サンプルボタン） */
    .action-toolbar {
      background: #f8fafc;
      border-top: 1px solid var(--border);
      padding: 6px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .font-size-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .font-btn {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: #475569;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
      font-weight: bold;
    }
    .font-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
    .sample-mini-group {
      display: flex;
      gap: 6px;
    }
    .mini-sample-btn {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: #334155;
      width: 30px;
      height: 28px;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mini-sample-btn:active {
      background: #e2e8f0;
    }

    /* 現場入力フッター（画面約1/4の高さを確保） */
    footer {
      border-top: 1px solid var(--border);
      padding: 10px;
      background: white;
      display: flex;
      gap: 8px;
      height: 24vh;
      min-height: 140px;
      flex-shrink: 0;
    }
    .footer-left-btns {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 50px;
      flex-shrink: 0;
    }
    .file-btn {
      background: #e2e8f0;
      border: none;
      border-radius: 6px;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.4rem;
    }
    textarea {
      flex: 1;
      height: 100%;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: var(--font-input);
      line-height: 1.4;
      resize: none;
      outline: none;
      font-family: inherit;
    }
    .send-btn {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      width: 65px;
      height: 100%;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .send-btn:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    /* 設定モーダル */
    .modal {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-content {
      background: white;
      padding: 16px;
      border-radius: 8px;
      width: 100%;
      max-width: 400px;
    }
    .modal-content h2 { font-size: 1rem; margin-bottom: 12px; }
    .modal-content label { display: block; font-size: 0.8rem; margin: 8px 0 4px; color: #475569; }
    .modal-content input {
      width: 100%;
      padding: 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.85rem;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 14px;
    }
    .modal-actions button {
      padding: 6px 12px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 0.85rem;
    }
  </style>
</head>
<body class="font-normal">

<div class="app-container">
  <!-- ヘッダー -->
  <header>
    <h1>アレ・コレ（ARE-KORE）</h1>
    <div class="header-btns">
      <button onclick="resetChat()">クリア</button>
      <button onclick="openSettings()">⚙ 設定</button>
    </div>
  </header>

  <!-- チャット履歴 -->
  <div class="chat-box" id="chatBox"></div>

  <!-- 画像プレビュー -->
  <div class="preview-bar" id="previewBar">
    <img id="previewImg" src="">
    <span id="previewText">画像添付中</span>
    <button onclick="clearImage()">×</button>
  </div>

  <!-- ツールバー：左に文字サイズ切替、右に小型サンプルボタン -->
  <div class="action-toolbar">
    <div class="font-size-group">
      <span style="font-size: 0.72rem; color: #64748b; margin-right: 2px;">文字:</span>
      <button class="font-btn active" id="btnFontNormal" onclick="setFontSize('normal')">普通</button>
      <button class="font-btn" id="btnFontMedium" onclick="setFontSize('medium')">中</button>
      <button class="font-btn" id="btnFontLarge" onclick="setFontSize('large')">大</button>
    </div>
    <div class="sample-mini-group">
      <button class="mini-sample-btn" onclick="onSampleClick(1)" title="サンプル1">1</button>
      <button class="mini-sample-btn" onclick="onSampleClick(2)" title="サンプル2">2</button>
      <button class="mini-sample-btn" onclick="onSampleClick(3)" title="サンプル3">3</button>
    </div>
  </div>

  <!-- 現場入力フッター -->
  <footer>
    <div class="footer-left-btns">
      <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFileSelect(event)">
      <button class="file-btn" onclick="document.getElementById('fileInput').click()" title="カメラ・写真選択">📷</button>
    </div>
    <textarea id="textInput" placeholder="短文入力 (改行区切りOK)&#10;例:&#10;ダクターD2&#10;3m&#10;ダイマ&#10;1束&#10;明日午後 / 既設エリア"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">送信</button>
  </footer>

  <!-- 設定モーダル -->
  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <h2>⚙ アプリ・メール送信設定</h2>
      <label>Gemini APIキー:</label>
      <input type="password" id="apiKeyInput" placeholder="AI StudioのAPIキーを入力">
      <label>送信先メールアドレス (To):</label>
      <input type="email" id="mailToInput" placeholder="office@example.com">
      <label>CC メールアドレス (任意):</label>
      <input type="email" id="mailCcInput" placeholder="site-cc@example.com">
      <label>担当者名 / 工区名 (任意):</label>
      <input type="text" id="senderNameInput" placeholder="例: 電気A工区 花岡">

      <div class="modal-actions">
        <button onclick="closeSettings()" style="background:#e2e8f0;">閉じる</button>
        <button onclick="saveSettings()" style="background:var(--primary);color:white;">保存</button>
      </div>
    </div>
  </div>
</div>

<script>
  /* システムプロンプト */
  const SYSTEM_INSTRUCTION = `
あなたは現場資材手配・仕様特定アシスタント「アレ・コレ」です。
職人や管理者の短文入力・現場写真から資材を特定し、手配を支援します。

【基本カタログ】
ネグロス電工、未来工業、丸井産業、共同カイテック

【重要：仕様確認ルール】
チャンネル・レール類（ダクター等）は「定尺（2m/3m/4m等）」と「材質・表面処理（ダイマ、ドブ、SUS等）」が必須です。
これらが抜けている場合、勝手に補完せず必ず【仮受付フォーマット】で聞き返してください。

【出力フォーマット】
1. 不足がある場合：
■ 手配内容の確認（仮受付）
・品名・型番: [品名]
・定尺・仕様: 【未指定：要確認】
・数量: [数量]
・希望納期日: [納期]
・納品場所: [場所]
【確認事項】: 不足項目を簡潔に質問

2. 全て揃った場合：
■ 手配内容の最終確認
・品名・型番: [正式型番・定尺・材質]
・区分: 購入
・数量: [数量]
・希望納期日: [納期]
・納品場所: [場所]
※ダクタークリップや適合ジョイント金具の追加要否を一言添える。
「上記の内容で手配・発注を確定してもよろしいでしょうか？（はい／いいえ）」

3. 「はい」で承認された場合：
■ 手配完了
確定内容を整理して出力し、「手配を確定いたしました」と結ぶ。
`;

  let chatHistory = [];
  let currentAttachedImage = null;
  let lastFinalDetails = null;

  window.addEventListener('DOMContentLoaded', () => {
    loadSettings();
    initFontSize();
    addMessageToUI('ai', '現場支援AI「アレ・コレ」起動しました。\n短文入力（ダクターD2 / 3m / ダイマ...）または写真添付で指示してください！');
  });

  /* 文字サイズ切り替えロジック */
  function setFontSize(size) {
    document.body.classList.remove('font-normal', 'font-medium', 'font-large');
    document.getElementById('btnFontNormal').classList.remove('active');
    document.getElementById('btnFontMedium').classList.remove('active');
    document.getElementById('btnFontLarge').classList.remove('active');

    if (size === 'medium') {
      document.body.classList.add('font-medium');
      document.getElementById('btnFontMedium').classList.add('active');
    } else if (size === 'large') {
      document.body.classList.add('font-large');
      document.getElementById('btnFontLarge').classList.add('active');
    } else {
      document.body.classList.add('font-normal');
      document.getElementById('btnFontNormal').classList.add('active');
      size = 'normal';
    }
    localStorage.setItem('arekore_font_size', size);
  }

  function initFontSize() {
    const savedSize = localStorage.getItem('arekore_font_size') || 'normal';
    setFontSize(savedSize);
  }

  /* サンプルボタン処理（後で指示内容を実装） */
  function onSampleClick(num) {
    // 指示内容を受け取り次第ここに処理を記載
    console.log(`Sample button ${num} clicked`);
  }

  /* 写真圧縮・リサイズ（通信時間大幅短縮） */
  function handleFileSelect(e) {
    const file = e.target.files[0];
    if (!file) return;

    const img = new Image();
    const reader = new FileReader();

    reader.onload = (event) => {
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const MAX_DIM = 1024;
        let width = img.width;
        let height = img.height;

        if (width > height) {
          if (width > MAX_DIM) {
            height *= MAX_DIM / width;
            width = MAX_DIM;
          }
        } else {
          if (height > MAX_DIM) {
            width *= MAX_DIM / height;
            height = MAX_DIM;
          }
        }
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        currentAttachedImage = canvas.toDataURL('image/jpeg', 0.8);
        document.getElementById('previewImg').src = currentAttachedImage;
        document.getElementById('previewBar').style.display = 'flex';
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  }

  function clearImage() {
    currentAttachedImage = null;
    document.getElementById('fileInput').value = '';
    document.getElementById('previewBar').style.display = 'none';
  }

  /* 高速ストリーミング送信処理 */
  async function sendMessage(overrideText = null) {
    const textInput = document.getElementById('textInput');
    const sendBtn = document.getElementById('sendBtn');
    const text = overrideText || textInput.value.trim();
    const imageToSend = currentAttachedImage;

    if (!text && !imageToSend) return;

    sendBtn.disabled = true;
    sendBtn.innerText = '送信中';

    addMessageToUI('user', text, imageToSend);
    if (!overrideText) textInput.value = '';
    clearImage();

    const apiKey = localStorage.getItem('arekore_api_key');
    if (!apiKey) {
      addMessageToUI('ai', '⚠ Gemini APIキーが未設定です。右上の「⚙ 設定」からAPIキーを入力してください。');
      sendBtn.disabled = false;
      sendBtn.innerText = '送信';
      openSettings();
      return;
    }

    const parts = [];
    if (text) parts.push({ text: text });
    if (imageToSend && imageToSend.startsWith('data:image')) {
      const mimeType = imageToSend.split(';')[0].split(':')[1];
      const base64Data = imageToSend.split(',')[1];
      parts.push({
        inlineData: { mimeType: mimeType, data: base64Data }
      });
    }

    chatHistory.push({ role: 'user', parts: parts });

    const msgId = addMessageToUI('ai', '...');
    const msgElem = document.getElementById(msgId).querySelector('div');

    try {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:streamGenerateContent?alt=sse&key=${apiKey}`;
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          systemInstruction: { parts: [{ text: SYSTEM_INSTRUCTION }] },
          contents: chatHistory
        })
      });

      if (!response.ok) {
        const errJson = await response.json();
        throw new Error(errJson.error?.message || response.statusText);
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let fullText = '';
      msgElem.innerText = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        const chunk = decoder.decode(value, { stream: true });
        const lines = chunk.split('\n');

        for (const line of lines) {
          if (line.startsWith('data: ')) {
            const dataStr = line.slice(6).trim();
            if (dataStr) {
              try {
                const parsed = JSON.parse(dataStr);
                const token = parsed.candidates?.[0]?.content?.parts?.[0]?.text || '';
                fullText += token;
                msgElem.innerText = fullText;
                document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
              } catch (e) {}
            }
          }
        }
      }

      chatHistory.push({ role: 'model', parts: [{ text: fullText }] });
      attachActionsToMessage(document.getElementById(msgId), fullText);

    } catch (err) {
      msgElem.innerText = '⚠ エラー: ' + err.message;
    } finally {
      sendBtn.disabled = false;
      sendBtn.innerText = '送信';
    }
  }

  function addMessageToUI(role, text, imgSrc = null) {
    const box = document.getElementById('chatBox');
    const msg = document.createElement('div');
    const id = 'msg_' + Date.now();
    msg.id = id;
    msg.className = `msg ${role === 'user' ? 'msg-user' : 'msg-ai'}`;

    if (imgSrc) {
      const img = document.createElement('img');
      img.src = imgSrc;
      msg.appendChild(img);
    }
    const txtNode = document.createElement('div');
    txtNode.innerText = text;
    msg.appendChild(txtNode);

    box.appendChild(msg);
    box.scrollTop = box.scrollHeight;
    return id;
  }

  function attachActionsToMessage(msgElem, text) {
    if (text.includes('最終確認') && text.includes('はい') && text.includes('いいえ')) {
      const actions = document.createElement('div');
      actions.className = 'quick-actions';
      actions.innerHTML = `
        <button class="quick-btn btn-yes" onclick="sendMessage('はい')">✓ はい（確定）</button>
        <button class="quick-btn btn-no" onclick="sendMessage('いいえ')">✗ いいえ（修正）</button>
      `;
      msgElem.appendChild(actions);
      lastFinalDetails = text;
    }

    if (text.includes('手配完了') || text.includes('手配を確定いたしました')) {
      const mailBtn = document.createElement('button');
      mailBtn.className = 'btn-mail';
      mailBtn.innerHTML = '✉️ メールソフトを起動して発注送信';
      mailBtn.onclick = () => launchMailClient(lastFinalDetails || text);
      msgElem.appendChild(mailBtn);
    }
    document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
  }

  function launchMailClient(bodyText) {
    const to = localStorage.getItem('arekore_mail_to') || 'office@example.com';
    const cc = localStorage.getItem('arekore_mail_cc') || '';
    const sender = localStorage.getItem('arekore_sender_name') || '現場担当者';

    const subject = encodeURIComponent(`【資材手配確定】${sender}より`);
    const fullBody = `現場支援AI「アレ・コレ」より以下の内容で手配が確定しました。\n\n${bodyText}\n\n送信元: ${sender}\n送信日時: ${new Date().toLocaleString()}`;
    const body = encodeURIComponent(fullBody);

    let mailtoUrl = `mailto:${to}?subject=${subject}&body=${body}`;
    if (cc) mailtoUrl += `&cc=${encodeURIComponent(cc)}`;

    window.location.href = mailtoUrl;
  }

  function openSettings() {
    document.getElementById('apiKeyInput').value = localStorage.getItem('arekore_api_key') || '';
    document.getElementById('mailToInput').value = localStorage.getItem('arekore_mail_to') || 'office@example.com';
    document.getElementById('mailCcInput').value = localStorage.getItem('arekore_mail_cc') || '';
    document.getElementById('senderNameInput').value = localStorage.getItem('arekore_sender_name') || '';
    document.getElementById('settingsModal').style.display = 'flex';
  }

  function closeSettings() {
    document.getElementById('settingsModal').style.display = 'none';
  }

  function saveSettings() {
    localStorage.setItem('arekore_api_key', document.getElementById('apiKeyInput').value.trim());
    localStorage.setItem('arekore_mail_to', document.getElementById('mailToInput').value.trim());
    localStorage.setItem('arekore_mail_cc', document.getElementById('mailCcInput').value.trim());
    localStorage.setItem('arekore_sender_name', document.getElementById('senderNameInput').value.trim());
    closeSettings();
    alert('設定を保存しました。');
  }

  function loadSettings() {
    if (!localStorage.getItem('arekore_mail_to')) {
      localStorage.setItem('arekore_mail_to', 'office@example.com');
    }
  }

  function resetChat() {
    if (confirm('会話履歴をクリアして最初に戻しますか？')) {
      chatHistory = [];
      clearImage();
      document.getElementById('chatBox').innerHTML = '';
      addMessageToUI('ai', '現場支援AI「アレ・コレ」起動しました。\n短文入力または写真添付で指示してください！');
    }
  }
</script>
</body>
</html>
